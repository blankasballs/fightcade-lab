name: Release Windows Companion

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      enable_signpath:
        description: "Submit installer to SignPath Foundation OSS signing (requires SIGNPATH_* secrets)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-companion:
    runs-on: windows-latest
    steps:
      - name: Checkout Fightcade Lab
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime & Nuitka build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pillow nuitka ordered-set zstandard

      - name: Run Companion unit test suite (including frozen-import isolation & safety checks)
        run: |
          pytest tests/ --ignore=tests/test_coaching.py --ignore=tests/test_habit_rollup.py --ignore=tests/test_hybrid_habits.py --ignore=tests/test_index.py --ignore=tests/test_insights_pro_search.py --ignore=tests/test_segmentation.py --ignore=tests/test_sequence_search.py --ignore=tests/test_audio_and_benchmarks.py --ignore=tests/test_features.py -v

      - name: Build standalone Windows Companion (Nuitka, zero bundled FBNeo/FFmpeg)
        run: |
          python packaging/build_companion.py --output-dir dist/companion

      - name: Build zero-UAC per-user Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "0.1.0"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(.+)$') {
            $ver = $Matches[1]
          }
          Write-Host "Building FightcadeLabSetup-$ver.exe"
          iscc "/DAppVersion=$ver" packaging/fightcade_lab.iss

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/installer/FightcadeLabSetup-*.exe dist/release/
          Copy-Item LICENSE dist/release/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist/release/THIRD_PARTY_NOTICES.md
          $lines = Get-ChildItem dist/release -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines -join "`n" | Set-Content -Encoding ascii dist/release/SHA256SUMS.txt

      - name: Submit to SignPath Foundation OSS Code Signing (when configured)
        if: ${{ (github.event_name == 'push' || inputs.enable_signpath) && env.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fightcade-lab
          signing-policy-slug: release-signing
          github-artifact-id: companion-unsigned
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fightcade-lab-companion-win64
          path: dist/release/*

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          body: |
            ## Fightcade Lab Windows Companion

            - **License:** `AGPL-3.0-or-later` (see `LICENSE.txt` and `THIRD_PARTY_NOTICES.md`).
            - **Zero bundled ROMs or external binaries:** Uses your own local Fightcade install and ROMs. Optional `fcadefbneo_fast.exe` and `ffmpeg.exe` are downloaded inside the Setup Wizard only after explicit user consent with SHA-256 checksum verification.
            - **Windows SmartScreen note:** This is a new unsigned open-source release compiled publicly from this repository by GitHub Actions (SignPath Foundation code signing is planned once the project grows). Windows Defender SmartScreen may show an "Unknown publisher" prompt on first launch. Click **More info -> Run anyway**, verify the installer hash against `SHA256SUMS.txt`, or inspect and run directly from source.
            - **Checksums:** Verify `FightcadeLabSetup-*.exe` against `SHA256SUMS.txt`.
